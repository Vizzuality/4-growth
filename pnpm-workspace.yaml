packages:
  - "api/**"
  - "client/**"
  - "shared/**"
  - "e2e/**"

onlyBuiltDependencies:
  - "@nestjs/core"

overrides:
  # d3-color: security fix — forces 3.1.0 across all d3 consumers
  d3-color: 3.1.0
  # qs: blanket override needed — express 4.21.2 (via nestjs-base-service) declares exact qs 6.13.0
  # 6.15.2 fixes remotely-triggerable DoS in qs.stringify (GHSA-q8mj-m7cp-5q26)
  qs: 6.15.2
  # nestjs-base-service ships outdated transitive deps; scope overrides to that parent
  "nestjs-base-service>express": "4.21.2"
  "express>path-to-regexp": "0.1.13"
  "nestjs-base-service>class-validator": "0.14.4"
  "nestjs-base-service>lodash": "4.18.1"
  # form-data <4.0.6: CRLF injection via unescaped multipart field names/filenames (GHSA-hmw2-7cc7-3qxx)
  # axios declares ^4.0.5 and supertest's superagent pins <4.0.6; scope to both parents
  "axios>form-data": "4.0.6"
  "superagent>form-data": "4.0.6"
  # multer <2.2.0: DoS via deeply nested field names (GHSA-72gw-mp4g-v24j) and
  # incomplete cleanup of aborted uploads (GHSA-3p4h-7m6x-2hcm); pulled by @nestjs/platform-express
  "@nestjs/platform-express>multer": "2.2.0"
  # @aws-sdk/xml-builder ships vulnerable fast-xml-parser <5.7.0 (GHSA-8gc5-j5rx-235r)
  # 5.8.0 also pulls fast-xml-builder >=1.2.0 fixing GHSA-5wm8-gmm8-39j9
  "@aws-sdk/xml-builder>fast-xml-parser": "5.8.0"
  # typeorm declares uuid ^11.1.0 but lockfile resolves 11.1.0 (GHSA-w5hq-g745-h8pq)
  "typeorm>uuid": "11.1.1"
  # next-auth declares uuid ^8.3.2 (vulnerable); v11 still exports the `v4` it imports (GHSA-w5hq-g745-h8pq)
  "next-auth>uuid": "11.1.1"
  # vite pulls esbuild 0.27.3 as optional dep (<0.28.1) — dev-server arbitrary file read on Windows (GHSA-g7r4-m6w7-qqqr)
  "vite>esbuild": "0.28.1"
  # next bundles postcss <8.5.10 (GHSA-qx2v-qp2m-jg93 — XSS via unescaped </style> in CSS stringify)
  "next>postcss": "8.5.15"
  # jsdom (test env) ships undici <7.28.0 (GHSA-vxpw-j846-p89q, GHSA-hm92-r4w5-c3mj, GHSA-vmh5-mc38-953g + others)
  "jsdom>undici": "7.28.0"
  # Dev-only transitive overrides — parents don't ship patched versions yet
  # fast-uri <3.1.2 (via ajv, build tooling only): path traversal (GHSA-q3j6-qgpj-74h6)
  # and host confusion (GHSA-v39h-62p7-jpjc) via percent-encoded segments
  "ajv>fast-uri": "3.1.3"
  # js-yaml quadratic-complexity DoS in merge-key handling (GHSA-h67p-54hq-rp68); both
  # vulnerable lines are dev-only: 3.x via jest coverage, 4.x via the nest cli
  "@istanbuljs/load-nyc-config>js-yaml": "3.15.0"
  "cosmiconfig>js-yaml": "4.3.0"
  # @babel/core <7.29.6: arbitrary file read via sourceMappingURL comment (GHSA-4x5r-pxfx-6jf8).
  # Dev-only (babel/jest transpile toolchain). Full override rather than scoped: the tree
  # resolves a single shared version (7.29.0) as a peer of dozens of @babel/plugin-*
  # packages, and 7.29.6 is a same-minor patch, so there is no other major to break.
  "@babel/core": "7.29.6"
  "flat-cache>flatted": "3.4.2"
  "minimatch>brace-expansion": "2.0.3"
  "postcss-load-config>yaml": "2.8.3"
  "http-proxy-agent>@tootallnate/once": "3.0.1"
  "micromatch>picomatch": "2.3.2"
  "anymatch>picomatch": "2.3.2"
  "readdirp>picomatch": "2.3.2"

catalog:
  # Core
  zod: 3.25.76
  "@types/node": 25.3.0
  typescript: 5.9.3
  typeorm: 0.3.29
  bcrypt: 6.0.0
  "@types/bcrypt": 6.0.0
  # Linting & formatting
  eslint: 10.2.0
  eslint-config-prettier: 10.1.8
  eslint-plugin-prettier: 5.5.5
  prettier: 3.8.1
  "@typescript-eslint/eslint-plugin": 8.56.1
  "@typescript-eslint/parser": 8.56.1
  # Testing
  "@types/jest": 30.0.0
  # Tooling
  ts-node: 10.9.2
  # Shared libraries
  "@types/lodash": 4.17.24
  lodash: 4.18.1
  qs: 6.15.2
  "@types/qs": 6.14.0
  class-transformer: 0.5.1
  class-validator: 0.14.4
